plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.studium.hk'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.studium.hk'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Clé de débogage partagée (mot de passe public « android ») : elle permet d'installer
    // les nouvelles versions par-dessus les anciennes. Pas adaptée à une publication sur le Play Store.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
